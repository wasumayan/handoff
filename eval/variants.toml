# Handoff variants compared by the eval. Each one decides what the recipient agent reads.
#
#   kind = "none"     nothing: the agent gets only the original task (what a user would retype)
#   kind = "raw"      the whole previous transcript pasted into the instruction file
#   kind = "ideal"    the scenario's hand-written ideal.md: an upper bound
#   kind = "handoff"  `handoff create ... <args>`; set ref = "<git ref>" to run an older version of
#                     the tool (checked out into eval/.cache/refs/), or checkout = "<path>" for any
#                     other copy of it. needs_backend = true when the variant calls a model.
#
# Add variants freely; `python eval/run.py plan` shows what a run would cost before it starts.

[none]
kind = "none"
description = "no handoff: task only"

[raw]
kind = "raw"
description = "full transcript pasted in"

[ideal]
kind = "ideal"
description = "hand-written ideal handoff (upper bound)"

[dump]
kind = "handoff"
args = ["--no-llm"]
description = "handoff, deterministic, recipient's default budget"

[dump-8k]
kind = "handoff"
args = ["--no-llm", "--budget", "8000"]
description = "handoff, deterministic, 8k-char budget (heavy compaction)"

[dump-2k]
kind = "handoff"
args = ["--no-llm", "--budget", "2000"]
description = "handoff, deterministic, 2k-char budget (drops assistant turns)"

[dump-64k]
kind = "handoff"
args = ["--no-llm", "--budget", "64000"]
description = "handoff, deterministic, 64k-char budget (no compaction)"

[adapted]
kind = "handoff"
args = []
needs_backend = true
description = "handoff with the model-written next.md (HANDOFF_BASE_URL / HANDOFF_MODEL)"

# The tool as of an older commit, run on identical inputs: compares versions of handoff itself.
# 39231ee is where this branch started, before the Codex parser and compaction fixes.
[dump-base]
kind = "handoff"
args = ["--no-llm"]
ref = "39231ee"
description = "handoff --no-llm as of commit 39231ee (before parser/compaction fixes)"
